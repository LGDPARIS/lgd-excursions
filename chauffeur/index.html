<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Feuille de route chauffeur – LGD Paris</title>
<style>
:root{--or:#E9A931;--nuit:#14161c;--fond:#f3efe6;--txt:#1d1d1f;--doux:#6b6b70;--ok:#1f8a4c;--okbg:#e3f4ea;--bord:#e2ddd2;--cur:#fff4d6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fond);color:var(--txt);font-size:16px;line-height:1.45}
header{background:var(--nuit);color:#fff;padding:16px}
.ex{display:inline-block;background:#c0392b;color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;margin-bottom:8px}
.marque{color:var(--or);font-size:12px;letter-spacing:.12em;font-weight:600}
header h1{margin:4px 0 6px;font-size:23px}
.meta{font-size:14px;color:#cfcfd4}
.prog{position:sticky;top:0;z-index:5;background:var(--nuit);color:#fff;padding:8px 14px;font-size:14px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:#2f323b;border-radius:3px;overflow:hidden}.bar i{display:block;height:6px;background:var(--or);width:0}
main{padding:12px;max-width:640px;margin:0 auto}
section{background:#fff;border:1px solid var(--bord);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}
.lieu{border:1px solid var(--bord);border-radius:10px;padding:10px;margin:8px 0;background:#fcfbf8}
.lieu .q{font-size:12px;color:var(--doux);font-weight:600;letter-spacing:.04em}
.lieu .a{font-size:15px;margin:2px 0 6px}
.lieu a{font-size:13px;text-decoration:none;background:var(--nuit);color:#fff;padding:6px 10px;border-radius:8px;display:inline-block}
.step{border-top:1px solid var(--bord);padding:10px 4px;transition:opacity .2s}
.step.locked{opacity:.4;pointer-events:none}
.step.current{background:var(--cur);border-radius:10px;padding:10px 8px}
.step.done .lbl::before{content:"✓ ";color:var(--ok);font-weight:700}
.lbl{font-weight:500}
.chk{display:flex;align-items:center;gap:12px;cursor:pointer}
.chk input{width:24px;height:24px;accent-color:var(--ok);flex:none}
.choix{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.choix button{flex:1;min-width:60px;font-size:15px;padding:10px 6px;border:1px solid var(--bord);border-radius:8px;background:#fff}
.choix button.sel{background:var(--nuit);color:#fff}
input[type=number],textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--bord);border-radius:8px;margin-top:6px}
.annonce{background:#fbf6ea;border-left:4px solid var(--or);padding:10px 12px;font-size:15px;margin:8px 0}
.annonce .t{font-size:12px;font-weight:600;color:#9a6a10;margin-bottom:4px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.slot{position:relative;border:2px dashed #c9c3b5;border-radius:10px;height:96px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--doux);overflow:hidden;cursor:pointer;padding:4px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.ok{border:2px solid var(--ok)}
.slot input{display:none}
.btn{display:block;width:100%;font-size:16px;font-weight:600;padding:12px;border-radius:10px;border:0;background:#1f8a4c;color:#fff;margin-top:8px}
.btn.sec{background:#fff;color:var(--txt);border:1px solid var(--bord);font-weight:500}
.msg{font-size:13px;color:var(--doux);margin-top:6px}
.warn{font-size:13px;color:#a0521a;margin-top:6px}
.pax{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 8px;border-top:1px solid var(--bord);border-radius:8px}
.pax.on{background:var(--okbg)}.pax.off{background:#fbe7e4}.pa{font-size:13px;padding:7px 8px;border:1px solid var(--bord);border-radius:8px;background:#fff}.pp.sel{background:var(--ok);color:#fff;border-color:var(--ok)}.aa.sel{background:#c0392b;color:#fff;border-color:#c0392b}
.pax .nom{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer}
.rond{width:24px;height:24px;border-radius:50%;border:2px solid #b9b4a8;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.pax.on .rond{background:var(--ok);border-color:var(--ok)}
.sous{font-size:12px;color:var(--doux)}
.tel{text-decoration:none;background:var(--nuit);color:#fff;font-size:13px;padding:7px 10px;border-radius:8px}
.cpt{font-weight:700}
pre{white-space:pre-wrap;font-size:13px;background:var(--fond);padding:10px;border-radius:8px}
.grp{font-size:12px;font-weight:700;color:var(--doux);letter-spacing:.04em;margin:10px 0 2px;text-transform:uppercase}
.etat{font-size:15px;color:var(--doux);text-align:center;padding:30px 10px}
</style>
</head>

  <div class="marque">URBAN TRIP BY LGD PARIS</div>
